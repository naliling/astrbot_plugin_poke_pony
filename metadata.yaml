name: astrbot_plugin_poke_pony
display_name: 新.戳一戳
desc: >-
  「新.戳一戳」不是又一个戳一戳。真正自定义：台词、触发词、平台、阈值全部你说了算，
  插件不预设一句台词；配置少不操心：装上只填两处（发言模板 + 拟真文案）就能用，
  其余默认值已经调好。QQ 原生戳一戳双向监听与自动回戳，Telegram / 飞书 / 企业微信 /
  微信个人号等无原生戳能力的平台用触发词模拟，还能用「自定义平台」接任意新适配器；
  三级回戳降级、可选 LLM 现场生成台词、按分钟阈值自动静默（可怼一句）的防骚扰、
  冷却限流、黑白名单、安静时段、统计排行榜，并可只读联动 humanoid_core 契约——她睡着时不吵。
  适配 AstrBot 4.13 及以上版本。
short_desc: 真正自定义 / 配置少不操心 / 全平台戳一戳（原生回戳 + 拟真降级 + LLM 台词 + 防骚扰）
