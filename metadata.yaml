name: astrbot_plugin_poke_pony
display_name: 新.戳一戳
desc: >-
  全平台戳一戳增强引擎：QQ / OneBot 原生戳一戳双向监听与自动回戳，Telegram、
  飞书、企业微信、微信个人号、QQ 官方机器人等无原生戳能力的平台通过触发词与指令
  模拟，还能用「自定义平台」接任意新适配器；内置权重随机 / 轮换 / 洗牌袋三模发言
  引擎、三级回戳降级、可选 LLM 现场生成台词、按分钟阈值自动静默（可怼一句）的
  防骚扰、冷却与限流、黑白名单、安静时段、今日与累计统计、排行榜，并可只读联动
  humanoid_core 的版本化契约——她睡着时不吵，情绪带进台词。
short_desc: 跨平台戳一戳：原生回戳 + 拟真降级 + LLM 台词 + 防骚扰 + 人形化联动
version: v1.91.79
